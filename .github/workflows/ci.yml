name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-snapshot:
    # Rule: the frozen v0.1.0 snapshot (data/ files + manifest) is never modified. A deliberate change needs a new
    # release and an explicit decision, so it must fail here first.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Frozen files are unchanged against the base branch
        run: >
          git diff --exit-code "origin/${{ github.base_ref }}" --
          data/stations.geojson data/connections.geojson data/metadata.json data/manifest.json

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Offline validation of the published snapshot and the v0.5 manifest
        run: python validate.py
      - name: Public explorer data equals a fresh build
        run: python build_explorer.py --check
      - name: Unit tests
        shell: bash
        run: |
          for d in tests research/transfer_aware_v02 research/network_robustness_v04 research/evidence_informed_robustness research/time_weighted_v05; do
            echo "== $d"
            python -m unittest discover -s "$d"
          done
